# .github/workflows/deploy-to-site.yml
name: Deploy to website repo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-to-website
  cancel-in-progress: false

env:
  FBT_GIT_SUBMODULE_SHALLOW: 1

jobs:
  build:
    if: github.repository == 'amir16yp/Rectum-Firmware' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build firmware and apps
        run: ./fbt TARGET_HW=7 DEBUG=0 COMPACT=1 copro_dist updater_package fap_dist

      - name: Set up Python for website generation
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Markdown renderer
        run: python -m pip install Markdown==3.10.3

      - name: Generate website and include firmware download
        run: >-
          python .github/workflow_data/build_site.py
          --readme ReadMe.md --dist dist --output build/website
          --commit "$GITHUB_SHA"

      - name: Upload website payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website-payload
          path: |
            build/website/index.html
            build/website/downloads/rectum-firmware-f7-update.tgz
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: github.repository == 'amir16yp/Rectum-Firmware' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # This runner never executes firmware code or scripts from the artifact.
    steps:
      - name: Checkout website repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: amir16yp/amir16yp.github.io
          path: website
          persist-credentials: false

      - name: Download website payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: website-payload
          path: payload

      - name: Copy generated website and firmware
        run: |
          # Accept only the two expected regular files, never repository metadata or scripts.
          python3 - <<'PY'
          from pathlib import Path

          root = Path("payload")
          expected = {"index.html", "downloads/rectum-firmware-f7-update.tgz"}
          files = set()
          for path in root.rglob("*"):
              if path.is_symlink():
                  raise SystemExit("Payload contains a symlink")
              if path.is_dir():
                  if path.relative_to(root).as_posix() != "downloads":
                      raise SystemExit("Payload contains an unexpected directory")
                  continue
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit("Payload contains an invalid file")
              files.add(path.relative_to(root).as_posix())
          if files != expected:
              raise SystemExit("Payload does not match the expected website files")
          PY
          rm -rf website/rectum-firmware/
          mkdir -p website/rectum-firmware/downloads/
          cp payload/index.html website/rectum-firmware/index.html
          cp payload/downloads/rectum-firmware-f7-update.tgz website/rectum-firmware/downloads/

      - name: Commit website update
        id: commit
        working-directory: website
        run: |
          git config core.hooksPath /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rectum-firmware

          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi

          git commit -m "Deploy website"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push website update
        if: steps.commit.outputs.changed == 'true'
        working-directory: website
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set +x
          test -n "$DEPLOY_TOKEN" || { echo "DEPLOY_TOKEN is not configured"; exit 1; }
          # The helper contains no credentials; Git reads the token from this step's environment.
          askpass="$RUNNER_TEMP/website-git-askpass.sh"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$DEPLOY_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git -c credential.helper= -c core.hooksPath=/dev/null \
            push https://github.com/amir16yp/amir16yp.github.io.git HEAD
